<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Santhi Ganesh Bakery...</title>
  <link rel="icon" type="image/png" href="./sg-bakery-logo.png">
  <meta http-equiv="refresh" content="3;url=/menu">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F6EFE8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1A120B;
      text-align: center;
    }
    .loader-box {
      background: #FFFFFF;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 340px;
      margin: 20px;
      border: 1px solid rgba(166,96,27,0.15);
    }
    .logo {
      height: 60px;
      margin-bottom: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(166, 96, 27, 0.2);
      border-top-color: #A6601B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.15rem;
      margin: 0 0 6px 0;
      font-weight: 700;
    }
    p {
      font-size: 0.86rem;
      color: #666;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <img src="./sg-bakery-logo.png" alt="Santhi Ganesh Bakery" class="logo">
    <div class="spinner"></div>
    <h2>Redirecting you...</h2>
    <p>Opening Santhi Ganesh Bakery</p>
  </div>

  <script>
    (async function() {
      const SUPABASE_URL = 'https://hkkdeowfoyejfifeftme.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhra2Rlb3dmb3llamZpZmVmdG1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjQ1NzYsImV4cCI6MjA5OTEwMDU3Nn0.EBw0t2IZoM8koDaV2AOFj6rQbyQINSo_mkrvhhhd0nU';
      
      let destination = '/menu';
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1200);
        
        const res = await fetch(`${SUPABASE_URL}/rest/v1/admin_settings?key=eq.dynamic_scan_redirect&select=value`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0 && data[0].value) {
            destination = data[0].value.trim();
          }
        }
      } catch (e) {
        console.warn('Redirect fallback:', e);
      }
      
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
